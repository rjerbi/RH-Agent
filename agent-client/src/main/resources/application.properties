spring.application.name=agent-client

server.port=8080

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b
spring.ai.ollama.embedding.model=nomic-embed-text

# MCP Streamable HTTP
spring.ai.mcp.client.streamable-http.connections.mcp-server.url=http://localhost:9090

# MCP request timeout
spring.ai.mcp.client.request-timeout=60s

# Use the same MySQL database as the MCP tools server.
spring.datasource.url=jdbc:mysql://localhost:3306/rh_recruitment
spring.datasource.username=root
spring.datasource.password=adm123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create the chat-memory table in MySQL if it does not exist.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always