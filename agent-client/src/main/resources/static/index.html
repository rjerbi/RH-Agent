<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Recruitment Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">RH</span>
            <strong>Recruitment AI</strong>
        </div>

        <button id="chatHomeBtn" class="nav-item active" type="button">✦ &nbsp; Chat with AI</button>
        <p class="side-title">QUICK START</p>
        <button class="nav-item prompt-chip" type="button" data-prompt="Find candidates">
            Find candidates
        </button>
        <button class="nav-item prompt-chip" type="button" data-prompt="Show all candidates">
            All candidates
        </button>

        <div class="sidebar-bottom">
            <span class="status-dot"></span>
            Candidate database
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>Chat With AI</h1>
            <div class="header-actions">
                <button id="deleteChatBtn" class="delete-chat" type="button"
                        aria-label="Delete conversation" title="Delete conversation">
                    <svg viewBox="0 0 24 24" width="18" height="18"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/>
                    </svg>
                </button>
                <button id="newChatBtn" class="new-chat" type="button">＋ New Chat</button>
            </div>
        </header>

        <section class="chat-window" aria-label="Recruitment assistant chat">
            <div id="chatContainer" class="chat-container" role="log" aria-live="polite">
                <div class="welcome-screen">
                    <div class="welcome-orb"></div>
                    <h2>Welcome to your recruitment assistant</h2>
                    <p>Ask about candidates or choose a place to start.</p>

                    <div class="prompt-grid">
                        <button class="prompt-chip prompt-card" type="button" data-prompt="Find candidates">
                            <span class="prompt-icon">⌕</span>
                            <strong>Find candidates</strong>
                            <small>Start by choosing a skill</small>
                        </button>
                        <button class="prompt-chip prompt-card" type="button" data-prompt="Check experience">
                            <span class="prompt-icon">↗</span>
                            <strong>Check experience</strong>
                            <small>Ask about a candidate profile</small>
                        </button>
                        <button class="prompt-chip prompt-card" type="button" data-prompt="Show all candidates">
                            <span class="prompt-icon">▤</span>
                            <strong>View candidates</strong>
                            <small>See everyone in your database</small>
                        </button>
                    </div>
                </div>
            </div>

            <form id="chatForm" class="composer">
                <label class="sr-only" for="messageInput">Write your message</label>
                <textarea
                    id="messageInput"
                    placeholder="Write your message..."
                    rows="1"></textarea>
                <button id="sendBtn" type="submit" aria-label="Send message">➤</button>
                <small>Enter to send · Shift + Enter for a new line</small>
            </form>
        </section>
    </main>
</div>
</body>
</html>
